[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-psf"
version = "1.0.0"
description = "Python port of SPRITE (sparse super-resolution of point-spread functions), built on ModOpt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CeCILL-2.1" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.0",
    "modopt>=1.7",
    "tifffile>=2023.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
plot = ["matplotlib>=3.7"]
# Documentation : `make html` dans ../docs (Sphinx, MyST, API autoapi).
docs = ["sphinx>=7", "sphinx-rtd-theme", "sphinx-autoapi", "myst-parser"]

[project.scripts]
sprite-psf = "sprite.cli:main"
sprite-psf-check = "sprite.cli:check_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::astropy.io.fits.verify.VerifyWarning", "ignore:Unexpected extra padding"]
